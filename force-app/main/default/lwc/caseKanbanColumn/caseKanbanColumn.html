<template>
    <div class={columnClass} ondragover={handleDragOver} ondragleave={handleDragLeave} ondrop={handleDrop}>
        <h2 class="column-header">{columnTitle}</h2>
        <div class="column-body">
            <template for:each={cases} for:item="caseRecord">
                <c-case-kanban-card key={caseRecord.Id} case-record={caseRecord}></c-case-kanban-card>
            </template>
            <template if:false={cases.length}>
                <p class="empty-column">No cases</p>
            </template>
        </div>
    </div>
</template>
